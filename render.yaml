# Render.com Blueprint — one-click deploy.
#
# REALITY OF FREE TIER: Render's free web service has NO persistent disk.
# To survive redeploys (so user accounts and history persist), we use an
# external free Postgres database from Supabase or Neon. The DATABASE_URL
# env var points at it.
#
# Setup steps (5 minutes):
#   1. Get a free Postgres at https://supabase.com (or https://neon.tech)
#       - Supabase: New project → Settings → Database → Connection string
#                   → "URI" tab → copy. Use "Transaction" pooler URL on
#                   port 6543 for serverless-friendly connections.
#       - Neon:     New project → "Connection Details" → copy URI
#   2. Push this repo to GitHub.
#   3. In Render: New + → Blueprint → pick this repo.
#   4. After the first deploy fails (because env vars aren't set yet),
#      go to Environment and set:
#         DATABASE_URL        = (paste your Supabase/Neon URL)
#         GEMINI_API_KEY      = (your Gemini key)
#         OPENROUTER_API_KEY  = (your OpenRouter key, optional)
#      AUTH_SECRET_KEY is auto-generated by Render.
#   5. Manual Deploy → "Deploy latest commit" once env is set.

services:
  - type: web
    name: interview-platform
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # --- Required secrets (set values in dashboard, NOT here) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false                # paste your Supabase / Neon URL here
      - key: AUTH_SECRET_KEY
        generateValue: true        # Render auto-generates a strong random value

      # --- Production cookie config ---
      - key: AUTH_COOKIE_SAMESITE
        value: lax                 # frontend served from same origin
      - key: AUTH_COOKIE_SECURE
        value: "1"                 # Render terminates TLS for us

      # --- Serve the bundled React UI from the same origin ---
      - key: SERVE_FRONTEND
        value: "1"

      # --- LLM behaviour ---
      - key: LLM_TIMEOUT_S
        value: "30"
      - key: LLM_RETRIES
        value: "2"
      - key: LLM_BACKOFF_S
        value: "1.5"
      - key: OPENROUTER_AUTO_DISCOVER
        value: "1"

      # --- Misc ---
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
